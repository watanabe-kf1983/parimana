[project]
name = "parimana"
version = "0.1.0"
description = ""
authors = [{ name = "Baya Minami", email = "baya.f.minami@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pandas>=2.0.1,<3",
    "scipy>=1.10.1,<2",
    "scikit-learn>=1.2.2,<2",
    "statsmodels>=0.14.1,<0.15",
    "openpyxl>=3.1.2,<4",
    "plotly>=5.18.0,<6",
    "selenium>=4.9.1,<5",
    "beautifulsoup4>=4.12.2,<5",
    "requests>=2.31.0,<3",
    "fastapi>=0.120.0,<0.121",
    "uvicorn[standard]>=0.23.2,<0.24",
    "mangum>=0.19.0,<0.20",
    "awslambdaric>=3.0.0,<4",
    "boto3>=1.35.93,<2",
    "redis>=5.0.0,<6",
    "celery>=5.3.1,<6",
    "flower>=2.0.1,<3",
    "pydantic-settings>=2.7.0,<3",
    "async-timeout>=4.0.3,<5",
    "toolz>=1.0.0,<2",
]

[project.scripts]
parimana = "parimana.interfaces.cui.main:main"

[dependency-groups]
dev = [
    "flake8>=6.0.0,<7",
    "mypy>=1.2.0,<2",
    "black>=26.3.1,<27",
    "isort>=5.12.0,<6",
    "pytest>=9.0.3,<10",
    "types-requests>=2.31.0.1,<3",
    "notebook>=6.5.4,<7",
]

[tool.mypy]
ignore_missing_imports = true

[tool.uv.build-backend]
module-root = ""
# parimana/ has no top-level __init__.py (implicit namespace package)
namespace = true

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
